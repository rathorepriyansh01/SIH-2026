services:
  - type: web
    name: crop-health-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false           # Set this manually in Render dashboard — never commit the value
      - key: DATABASE_URL
        fromDatabase:
          name: crop-health-ai-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://crop-health-ai.vercel.app   # Update to your actual Vercel URL after deploy
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: crop-health-ai-db
    databaseName: crop_health_ai
    user: crop_health_user
    plan: free
